name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Grant execute permission
        run: chmod +x FFPanel/gradlew
      - name: Build debug APK
        run: cd FFPanel && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: FFPanel-APK
          path: FFPanel/app/build/outputs/apk/debug/app-debug.apk
