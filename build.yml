name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 7.6
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.6-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          export PATH=/opt/gradle-7.6/bin:$PATH
          echo "/opt/gradle-7.6/bin" >> $GITHUB_PATH

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 7.6

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --warning-mode none

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FFPanel-APK
          path: app/build/outputs/apk/debug/app-debug.apk
